services:
  tokens:
    image: tokens-server-check:local
    # The crawl fixture intentionally lacks a complete six-context theme.
    command: [serve, --published, /var/lib/tokens/current, --listen, "0.0.0.0:8080"]
    restart: "no"
    env_file: !reset []
    environment:
      TOKENS_PUBLIC_ORIGIN: https://tokencatalog.dev/md3
    volumes: !override
      - test-state:/var/lib/tokens:ro
  updater:
    image: tokens-updater-check:local
    build:
      target: container-test
    volumes: !override
      - test-state:/var/lib/tokens
    env_file: !reset []
volumes:
  test-state:
