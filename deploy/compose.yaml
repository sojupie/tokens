name: tokens

services:
  tokens:
    image: tokens:local
    build:
      context: ..
      target: server
      additional_contexts:
        material_motion: ${TOKENS_MOTION_SOURCE:-https://github.com/sojupie/material-motion-lab.git#main}
        carousel_playground: ${TOKENS_PLAYGROUND_SOURCE:-https://github.com/sojupie/carousel-motion-lab.git#main}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    env_file:
      - path: /etc/tokens/server.env
        required: false
    environment:
      TOKENS_USAGE_DIR: /var/lib/tokens-usage
    volumes:
      - type: bind
        source: ${TOKENS_STATE_DIR:-/var/lib/tokens}
        target: /var/lib/tokens
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /var/lib/tokens-usage
        target: /var/lib/tokens-usage
        bind:
          create_host_path: false
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent --output /dev/null http://127.0.0.1:8080/ && curl --fail --silent --output /dev/null http://127.0.0.1:8080/tools/motion/ && curl --fail --silent --output /dev/null http://127.0.0.1:8080/tools/motion-lab/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      start_interval: 2s
      retries: 3
    networks: [web]

  cloudflared:
    image: cloudflare/cloudflared:latest
    pull_policy: always
    command: tunnel --no-autoupdate run
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    env_file:
      - path: /etc/tokens/cloudflared.env
        required: false
    depends_on:
      tokens:
        condition: service_healthy
    networks: [web]

  updater:
    image: tokens-updater:local
    build:
      context: ..
      target: updater
    profiles: [update]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp=./chromium-seccomp.json
    tmpfs:
      - /tmp:size=1g,mode=1777
    shm_size: 256m
    pids_limit: 256
    mem_limit: ${TOKENS_UPDATE_MEMORY:-4g}
    cpus: 2
    stop_grace_period: 30s
    env_file:
      - path: /etc/tokens/update.env
        required: false
    volumes:
      - type: bind
        source: ${TOKENS_STATE_DIR:-/var/lib/tokens}
        target: /var/lib/tokens
        bind:
          create_host_path: false
    command: [update, run, --state-dir, /var/lib/tokens, --page-catalog, /etc/tokens/page-catalog.json, --chrome-path, /usr/bin/chromium, --concurrency, "1", --page-timeout, 30s, --timeout, 1h]
    networks: [crawl]

  assets:
    image: tokens-assets:local
    build:
      context: ..
      target: asset-builder
    profiles: [update]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    mem_limit: ${TOKENS_UPDATE_MEMORY:-4g}
    volumes:
      - type: bind
        source: ${TOKENS_STATE_DIR:-/var/lib/tokens}
        target: /var/lib/tokens
        bind:
          create_host_path: false
    network_mode: none

  usage:
    image: tokens:local
    profiles: [usage]
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: [/tmp]
    env_file:
      - path: /etc/tokens/update.env
        required: false
    environment:
      TOKENS_USAGE_DIR: /var/lib/tokens-usage
    volumes:
      - type: bind
        source: /var/lib/tokens-usage
        target: /var/lib/tokens-usage
        bind:
          create_host_path: false
    command: [usage, --weekly]
    networks: [crawl]

networks:
  web:
  crawl:
