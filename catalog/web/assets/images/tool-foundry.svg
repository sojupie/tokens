<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img">
  <title>Token Foundry editor showing Material 3 tokens, group tree, resolved values, and variant controls</title>
  <defs>
    <clipPath id="foundry-window">
      <rect x="44" y="36" width="1112" height="678" rx="22"/>
    </clipPath>
    <filter id="foundry-shadow" x="-4%" y="-4%" width="108%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#1d1b20" flood-opacity="0.10"/>
    </filter>
  </defs>
  <!-- Catalog tool backdrop matching tool-motion.svg and tool-carousel-lab.svg -->
  <rect width="1200" height="750" fill="#e2e0f9"/>

  <!-- App window frame -->
  <g filter="url(#foundry-shadow)">
    <rect x="44" y="36" width="1112" height="678" rx="22" fill="#f5eff7"/>
  </g>

