      <text x="316" y="603" fill="#79747e" font-size="11.5">Shared</text>
      <text x="596" y="594" fill="#1d1b20" font-family="ui-monospace, Consolas, monospace" font-size="12.5">Roboto · 28 px · 400</text>
      <text x="954" y="594" fill="#49454e" font-size="12.5">typography</text>
      <text x="1028" y="594" fill="#49454e" font-size="12.5">Large title font</text>
      <line x1="272" y1="616" x2="1156" y2="616" stroke="#ece6f0" stroke-width="1"/>
