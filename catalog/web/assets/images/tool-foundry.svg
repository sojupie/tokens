      <!-- md (expanded) -->
      <path d="M124 176h5l2 2h7v10h-14z" fill="none" stroke="#49454e" stroke-width="1.4" stroke-linejoin="round"/>
      <text x="146" y="186" fill="#1d1b20">md</text>
      <path d="M244 184l4-4 4 4" fill="none" stroke="#49454e" stroke-width="1.5" stroke-linecap="round"/>
      <!-- comp -->
      <path d="M132 214h5l2 2h7v10h-14z" fill="none" stroke="#49454e" stroke-width="1.4" stroke-linejoin="round"/>
      <text x="154" y="224">comp</text>
      <path d="M244 218l4 4 4-4" fill="none" stroke="#49454e" stroke-width="1.5" stroke-linecap="round"/>
      <!-- fab -->
      <path d="M132 252h5l2 2h7v10h-14z" fill="none" stroke="#49454e" stroke-width="1.4" stroke-linejoin="round"/>
      <text x="154" y="262">fab</text>
      <path d="M244 256l4 4 4-4" fill="none" stroke="#49454e" stroke-width="1.5" stroke-linecap="round"/>
      <!-- outlined-ic... -->
      <path d="M132 290h5l2 2h7v10h-14z" fill="none" stroke="#49454e" stroke-width="1.4" stroke-linejoin="round"/>
      <text x="154" y="300">outlined-ic...</text>
      <path d="M244 294l4 4 4-4" fill="none" stroke="#49454e" stroke-width="1.5" stroke-linecap="round"/>
      <!-- ref -->
      <path d="M132 328h5l2 2h7v10h-14z" fill="none" stroke="#49454e" stroke-width="1.4" stroke-linejoin="round"/>
      <text x="154" y="338">ref</text>
      <path d="M244 332l4 4 4-4" fill="none" stroke="#49454e" stroke-width="1.5" stroke-linecap="round"/>
      <!-- sys -->
      <path d="M132 366h5l2 2h7v10h-14z" fill="none" stroke="#49454e" stroke-width="1.4" stroke-linejoin="round"/>
      <text x="154" y="376">sys</text>
      <path d="M244 370l4 4 4-4" fill="none" stroke="#49454e" stroke-width="1.5" stroke-linecap="round"/>
