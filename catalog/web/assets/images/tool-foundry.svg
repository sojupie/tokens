      <rect x="288" y="427" width="14" height="14" rx="2.5" fill="none" stroke="#49454e" stroke-width="1.5"/>
      <text x="316" y="430" fill="#1d1b20" font-family="ui-monospace, Consolas, monospace" font-size="12.5">md.comp.app-bar.icon-button-space</text>
      <text x="316" y="447" fill="#79747e" font-size="11.5">Shared</text>
      <text x="596" y="438" fill="#4f378b" font-family="ui-monospace, Consolas, monospace" font-size="12.5">{md.sys.measurement.space0}</text>
      <text x="822" y="438" fill="#1d1b20" font-family="ui-monospace, Consolas, monospace" font-size="12.5">0 px</text>
      <text x="954" y="438" fill="#49454e" font-size="12.5">dimension</text>
      <text x="1028" y="438" fill="#49454e" font-size="12.5">App bar icon spacing</text>
      <line x1="272" y1="460" x2="1156" y2="460" stroke="#ece6f0" stroke-width="1"/>
    </g>
    <!-- Row 6 (selected highlight) -->
