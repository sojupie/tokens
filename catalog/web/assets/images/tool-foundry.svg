      <text x="596" y="282" fill="#4f378b" font-family="ui-monospace, Consolas, monospace" font-size="12.5">{md.sys.elevation.level0}</text>
      <text x="822" y="282" fill="#1d1b20" font-family="ui-monospace, Consolas, monospace" font-size="12.5">0 px</text>
      <text x="954" y="282" fill="#49454e" font-size="12.5">dimension</text>
      <text x="1028" y="282" fill="#49454e" font-size="12.5">App bar elevation</text>
