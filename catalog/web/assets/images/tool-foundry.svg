      <text x="596" y="230" fill="#1d1b20" font-family="ui-monospace, Consolas, monospace" font-size="12.5">32 px</text>
      <text x="954" y="230" fill="#49454e" font-size="12.5">dimension</text>
      <text x="1028" y="230" fill="#49454e" font-size="12.5">App bar avatar size</text>
