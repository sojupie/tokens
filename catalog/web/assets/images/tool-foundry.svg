      <text x="954" y="386" fill="#49454e" font-size="12.5">dimension</text>
      <text x="1028" y="386" fill="#49454e" font-size="12.5">App bar icon size</text>
      <line x1="272" y1="408" x2="1156" y2="408" stroke="#ece6f0" stroke-width="1"/>
