      <text x="154" y="64">Edit</text>
      <text x="198" y="64">View</text>
      <text x="248" y="64">Variants</text>
      <text x="318" y="64">Help</text>
      <text x="366" y="64" fill="#49454e" font-weight="400">Material 3</text>
    </g>
    <rect x="1028" y="45" width="112" height="28" rx="14" fill="#e6e0e9"/>
    <text x="1084" y="63.5" fill="#79747e" font-size="12.5" font-weight="500" text-anchor="middle">Review changes</text>

    <!-- Far-left Navigation Rail -->
    <rect x="44" y="82" width="62" height="632" fill="#f5eff7"/>
    <!-- Tokens (active) -->
    <rect x="53" y="92" width="44" height="28" rx="14" fill="#e0dcf5"/>
    <path d="M75 99l-8 4.2 8 4.2 8-4.2-8-4.2zm-8 7.2l8 4.2 8-4.2" fill="none" stroke="#1d1b20" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="75" y="134" fill="#1d1b20" font-size="11.5" font-weight="500" text-anchor="middle">Tokens</text>
    <!-- Variants -->
    <g stroke="#49454e" stroke-width="1.5" stroke-linecap="round">
      <line x1="67" y1="158" x2="83" y2="158"/>
      <line x1="67" y1="164" x2="83" y2="164"/>
      <line x1="67" y1="170" x2="83" y2="170"/>
      <circle cx="71" cy="158" r="2" fill="#f5eff7"/>
      <circle cx="79" cy="164" r="2" fill="#f5eff7"/>
      <circle cx="73" cy="170" r="2" fill="#f5eff7"/>
    </g>
    <text x="75" y="188" fill="#49454e" font-size="11.5" text-anchor="middle">Variants</text>
    <!-- Workspace -->
    <g fill="none" stroke="#49454e" stroke-width="1.5">
      <circle cx="71" cy="214" r="2.5"/>
      <circle cx="79" cy="214" r="2.5"/>
      <path d="M69 224c0-2.5 2-4 6-4s6 1.5 6 4"/>
    </g>
    <text x="75" y="242" fill="#49454e" font-size="11.5" text-anchor="middle">Workspace</text>
    <!-- Moon icon at bottom -->
    <path d="M78.5 686a6.5 6.5 0 1 1-7-9.5 5 5 0 0 0 7 9.5z" fill="none" stroke="#49454e" stroke-width="1.6" stroke-linejoin="round"/>

    <!-- Groups sidebar -->
    <rect x="106" y="82" width="166" height="632" fill="#faf6fc"/>
    <line x1="106" y1="82" x2="106" y2="714" stroke="#e6e0e9" stroke-width="1"/>
    <line x1="272" y1="82" x2="272" y2="714" stroke="#e6e0e9" stroke-width="1"/>
    <text x="120" y="108" fill="#1d1b20" font-size="13.5" font-weight="500">Groups</text>
    <g fill="#49454e">
      <circle cx="246" cy="103" r="1.4"/><circle cx="251" cy="103" r="1.4"/><circle cx="256" cy="103" r="1.4"/>
    </g>
    <!-- Active All tokens pill -->
