      <text x="316" y="638" fill="#1d1b20" font-family="ui-monospace, Consolas, monospace" font-size="12.5">md.comp.app-bar.leading-space</text>
      <text x="316" y="655" fill="#79747e" font-size="11.5">Shared</text>
      <text x="596" y="646" fill="#4f378b" font-family="ui-monospace, Consolas, monospace" font-size="12.5">{md.sys.measurement.space50}</text>
      <text x="822" y="646" fill="#1d1b20" font-family="ui-monospace, Consolas, monospace" font-size="12.5">4 px</text>
