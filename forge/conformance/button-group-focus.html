<!doctype html><meta charset="utf-8"><title>Button group checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:760px;height:700px}pre{white-space:pre-wrap}</style>
<h1>Button group checks</h1><button id="run">Run group checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples');run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)};
try{for(const control of ['standard','connected']){samples.replaceChildren();const f=document.createElement('iframe');samples.append(f);await new Promise(resolve=>{f.onload=resolve;f.src=`/md3/components/button-groups?preview.compare=interactive&preview.control=${control}`});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const group=d.querySelector('#component-preview .md-button-group'),buttons=[...group.querySelectorAll('button')],key=(i,key)=>{buttons[i].focus();buttons[i].dispatchEvent(new w.KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}))};assert(buttons.filter(b=>b.tabIndex===0).length===1,`${control}: one Tab entry`);assert(!group.hasAttribute('tabindex'),'Group container is not focusable');key(0,'ArrowRight');assert(d.activeElement===buttons[1],'Right focuses next button');assert(buttons[1].tabIndex===0&&buttons[0].tabIndex===-1,'Navigation updates Tab entry');buttons[2].disabled=true;key(1,'ArrowRight');assert(d.activeElement===buttons[0],'Navigation skips disabled controls and wraps');group.dir='rtl';key(1,'ArrowRight');assert(d.activeElement===buttons[0],'RTL reverses horizontal arrows');if(control==='connected')assert(Math.abs(group.getBoundingClientRect().width-group.parentElement.getBoundingClientRect().width)<1,'Connected group fills its surface');}
out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
