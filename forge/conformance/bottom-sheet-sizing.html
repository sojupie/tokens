<!doctype html><meta charset="utf-8"><title>Bottom sheet sizing checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:390px;height:600px}pre{white-space:pre-wrap}</style>
<h1>Bottom sheet sizing checks</h1><button id="run">Run bottom sheet checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples');run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)},wait=ms=>new Promise(r=>setTimeout(r,ms));
try{for(const width of [390,1000]){samples.replaceChildren();const f=document.createElement('iframe');f.style.width=width+'px';samples.append(f);await new Promise(resolve=>{f.onload=resolve;f.src='/md3/components/bottom-sheets?preview.compare=interactive&preview.control=modal&preview.variant=expanded'});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const sheet=d.querySelector('#component-preview dialog.md-bottom-sheet'),body=sheet.querySelector('.md-sheet-body'),handle=sheet.querySelector('[data-sheet-handle]'),opener=d.querySelector('[data-sheet-open]');for(let i=0;i<30;i++){const p=d.createElement('p');p.textContent='Long sheet content '+i;body.append(p)}opener.click();await wait(600);let r=sheet.getBoundingClientRect();assert(r.height<=w.innerHeight/2+1,`${width}: initial view stays within half the screen`);const hr=handle.getBoundingClientRect(),mark=handle.querySelector('.md-sheet-handle-mark').getBoundingClientRect();assert(Math.abs(mark.top-r.top-22)<1,'Handle has 22px top padding from sheet edge');assert(Math.abs(hr.bottom-mark.bottom-22)<1,'Handle has 22px bottom padding');handle.dispatchEvent(new w.KeyboardEvent('keydown',{key:'ArrowUp',bubbles:true,cancelable:true}));await wait(600);r=sheet.getBoundingClientRect();assert(r.height>w.innerHeight/2,'Expanded sheet grows beyond half the screen');assert(r.top>=(width>640?56:72)-1,'Expanded sheet preserves top clearance');if(width>640){assert(r.width<=640,'Large-window sheet is capped at 640px');assert(r.left>=56&&r.right<=d.documentElement.clientWidth-56,'Large-window sheet keeps side margins')};body.scrollTop=150;assert(body.scrollTop>0,'Expanded body scrolls internally');sheet.querySelector('[data-sheet-close]').click();await wait(600);opener.click();await wait(600);assert(sheet.getBoundingClientRect().height<=w.innerHeight/2+1,'Reopening resets initial height');}
out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
