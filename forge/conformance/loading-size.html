<!doctype html><meta charset="utf-8"><title>Loading indicator size checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:1000px;height:700px}pre{white-space:pre-wrap}</style>
<h1>Loading indicator size checks</h1><button id="run">Run loading size checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples');run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)};
try{samples.replaceChildren();const f=document.createElement('iframe');samples.append(f);await new Promise(resolve=>{f.onload=resolve;f.src='/md3/components/loading-indicator?preview.compare=interactive'});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const indicator=d.querySelector('#component-preview .md-loading'),pane=indicator.closest('.md-progress-demo'),svg=indicator.querySelector('svg');assert(pane.hasAttribute('data-loading-adaptive'),'Interactive specimen uses its pane for adaptive sizing');pane.style.maxInlineSize='none';pane.style.inlineSize='250px';const base=indicator.getBoundingClientRect().width,ratio=svg.getBoundingClientRect().width/base;assert(base===48,'Compact pane keeps the source 48px default');pane.style.inlineSize='700px';assert(indicator.getBoundingClientRect().width===96,'Larger pane scales indicator to 96px');assert(Math.abs(svg.getBoundingClientRect().width/indicator.getBoundingClientRect().width-ratio)<.001,'Scaling preserves the active/container ratio');indicator.style.setProperty('--_loading-scale','0');assert(indicator.getBoundingClientRect().width===24,'Requested size is clamped at 24px');indicator.style.setProperty('--_loading-scale','20');assert(indicator.getBoundingClientRect().width===240,'Requested size is clamped at 240px');assert(Math.abs(svg.getBoundingClientRect().width/indicator.getBoundingClientRect().width-ratio)<.001,'Maximum size preserves the active/container ratio');out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
