<!doctype html><meta charset="utf-8"><title>Side sheet layout checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:900px;height:700px}pre{white-space:pre-wrap}</style>
<h1>Side sheet layout checks</h1><button id="run">Run sheet layout checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples');run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)},wait=ms=>new Promise(r=>setTimeout(r,ms));
try{for(const side of ['start','end']){samples.replaceChildren();const f=document.createElement('iframe');samples.append(f);await new Promise(resolve=>{f.onload=resolve;f.src=`/md3/components/side-sheets?preview.compare=interactive&preview.control=standard&preview.orientation=${side}`});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const sheet=d.querySelector('#component-preview .md-side-sheet'),frame=sheet.closest('.md-sheet-frame'),label=frame.querySelector('.md-sheet-page-label'),body=sheet.querySelector('.md-sheet-body'),opener=d.querySelector('#component-preview [data-sheet-open]'),original=label.getBoundingClientRect().width;opener.click();await wait(600);assert(label.getBoundingClientRect().width<original,'Standard sheet reserves page width');const r=sheet.getBoundingClientRect(),l=label.getBoundingClientRect();assert(side==='start'?r.right<=l.left+1:l.right<=r.left+1,`${side}: sheet does not cover page content`);for(let i=0;i<30;i++){const p=d.createElement('p');p.textContent='Long sheet content '+i;body.append(p)}body.scrollTop=200;assert(body.scrollTop>0,'Body scrolls independently');assert(sheet.scrollTop===0,'Sheet header and footer do not scroll');const word=d.createElement('p');word.textContent='x'.repeat(200);body.append(word);assert(body.scrollWidth<=body.clientWidth,'Long content does not create horizontal scroll');sheet.querySelector('[data-sheet-close]').click();await wait(600);assert(Math.abs(label.getBoundingClientRect().width-original)<1,'Closing releases reserved page width');}
out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
