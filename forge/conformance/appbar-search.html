<!doctype html><meta charset="utf-8"><title>App bar search checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:1000px;height:850px}pre{white-space:pre-wrap}</style>
<h1>App bar search checks</h1><button id="run">Run checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result');run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)},frames=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
try{const f=document.createElement('iframe');document.querySelector('#samples').replaceChildren(f);await new Promise(resolve=>{f.onload=resolve;f.src='/md3/components/app-bars?preview.compare=interactive&preview.variant=small&preview.control=search'});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const root=d.querySelector('#component-preview .md-appbar-demo.md-search-demo'),trigger=root.querySelector('[data-search-open]'),panel=root.querySelector('.md-search-view'),input=panel.querySelector('.md-search-input'),page=root.querySelector('.md-search-page');assert(trigger.getAttribute('aria-controls')===panel.id,'Trigger names the shared search view');assert(w.getComputedStyle(panel).visibility==='hidden','Closed search is hidden');trigger.click();await frames();assert(panel.dataset.open==='true'&&panel.getAttribute('role')==='dialog','Trigger opens search dialog');assert(d.activeElement===input,'Search receives focus');assert(page.inert&&trigger.getAttribute('aria-expanded')==='true','Background is inert while search is open');input.value='button';input.dispatchEvent(new w.Event('input',{bubbles:true}));assert(panel.querySelector('[data-search-result="Buttons"]').hidden===false&&panel.querySelector('[data-search-result="Cards"]').hidden,'Shared search filters results');input.dispatchEvent(new w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));assert(panel.dataset.open==='false'&&!page.inert,'Escape closes search');assert(d.activeElement===trigger&&trigger.getAttribute('aria-expanded')==='false','Escape restores trigger focus');trigger.click();for(const [width,variant]of [[390,'full-screen'],[750,'docked']]){root.style.inlineSize=width+'px';await frames();assert(panel.dataset.variant===variant,`${width}px pane uses ${variant}`);assert(input.value==='button'&&panel.dataset.open==='true','Resizing preserves query and open state');}panel.querySelector('[data-search-result="Buttons"] button').click();assert(page.querySelector('[data-search-page-title]').textContent==='Buttons','Result updates page content');assert(d.activeElement===page.querySelector('[data-search-page-title]'),'Result focuses updated heading');out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
