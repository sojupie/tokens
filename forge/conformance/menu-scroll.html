<!doctype html><meta charset="utf-8"><title>Menu scroll checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:390px;height:700px}pre{white-space:pre-wrap}</style>
<h1>Menu scroll checks</h1><button id="run">Run menu checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples');run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)};
try{samples.replaceChildren();const f=document.createElement('iframe');samples.append(f);await new Promise(resolve=>{f.onload=resolve;f.src='/md3/components/menus?preview.compare=interactive'});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const opener=d.querySelector('#component-preview [data-menu-open]'),menu=d.getElementById(opener.dataset.menuOpen),list=menu.querySelector('ul');for(let i=0;i<24;i++)list.append(list.querySelector('li').cloneNode(true));const style=d.createElement('style');style.textContent='.md-menu{--_menu-gap:8px}';d.head.append(style);opener.click();assert(menu.hasAttribute('data-menu-scrollable'),'Overflowing menu selects scrolling treatment');assert(w.getComputedStyle(menu).overflowY==='scroll','Menu requests a persistent scrollbar');for(const region of menu.querySelectorAll('section,ul'))assert(parseFloat(w.getComputedStyle(region).gap)===0,'Scrollable menu has no gaps');menu.scrollTop=120;assert(menu.scrollTop>0,'Menu can scroll');menu.hidePopover();list.replaceChildren(list.firstElementChild);opener.click();assert(!menu.hasAttribute('data-menu-scrollable'),'Short menu clears scrolling treatment');out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
