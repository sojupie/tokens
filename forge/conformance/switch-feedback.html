<!doctype html><meta charset="utf-8"><title>Switch feedback checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:760px;height:700px}pre{white-space:pre-wrap}</style>
<h1>Switch feedback checks</h1><button id="run">Run feedback checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples');run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)},wait=ms=>new Promise(r=>setTimeout(r,ms));
try{samples.replaceChildren();const f=document.createElement('iframe');samples.append(f);await new Promise(resolve=>{f.onload=resolve;f.src='/md3/components/switch?preview.compare=interactive'});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const root=d.querySelector('#component-preview .md-switch'),input=root.querySelector('input'),handle=root.querySelector('.md-switch-handle'),scale=()=>new w.DOMMatrixReadOnly(w.getComputedStyle(handle,'::before').transform).a;for(const checked of [false,true]){input.checked=checked;root.dataset.componentState='enabled';await wait(500);const before=scale(),width=root.getBoundingClientRect().width;root.dataset.componentState='hovered';await wait(500);assert(scale()>before,`${checked}: hover grows feedback area`);assert(Math.abs(scale()-1)<.01,'Feedback reaches its token size');assert(root.getBoundingClientRect().width===width,'Feedback does not move or resize the target');assert(w.getComputedStyle(input).cursor==='pointer','Input retains interactive cursor');input.disabled=true;root.dataset.componentState='enabled';await wait(500);assert(scale()<1,'Disabled switch has no expanded feedback');input.disabled=false;}
out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
