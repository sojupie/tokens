<!doctype html><meta charset="utf-8"><title>Carousel content checks</title>
<style>body{font:16px system-ui;margin:20px}iframe{width:390px;height:780px}pre{white-space:pre-wrap}</style>
<h1>Carousel content checks</h1><button id="run">Run content checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script>
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples');
run.onclick=async()=>{run.disabled=true;const checks=[],check=(ok,name)=>{if(!ok)throw Error(name);checks.push(name)},wait=ms=>new Promise(r=>setTimeout(r,ms));
try{
for(const variant of ['multi-browse','hero','center-aligned-hero','uncontained','uncontained-multi-aspect-ratio','full-screen'])for(const content of (variant==='full-screen'?['overlay']:['above','below','overlay'])){
 samples.replaceChildren();const frame=document.createElement('iframe');samples.append(frame);
 await new Promise(resolve=>{frame.onload=resolve;frame.src=`/components/carousel?preview.compare=interactive&preview.variant=${variant}&preview.content=${content}&preview.viewport=360`});
 const d=frame.contentDocument,w=frame.contentWindow;await w.TokenAssets.ready;await wait(80);
 const root=d.querySelector('#component-preview .md-carousel'),items=[...root.querySelectorAll('.md-carousel-item')];
 const tag=variant+'/'+content;
 if(variant==='full-screen')check(parseFloat(w.getComputedStyle(items[0]).borderTopLeftRadius)===0,tag+': square corners');
 if(content==='overlay'){
  const caption=items[0].querySelector('.md-carousel-caption'),style=w.getComputedStyle(caption);
  check(style.backgroundColor==='rgba(0, 0, 0, 0)'&&parseFloat(style.paddingTop)===0&&parseFloat(style.borderRadius)===0,tag+': plain text without a container');
  check(caption.textContent.trim().length<=14,tag+': brief label');
  check(parseFloat(style.fontSize)===16&&parseFloat(style.lineHeight)===24,tag+': title-medium typography');
  check(parseFloat(style.insetInlineStart)===16&&parseFloat(style.bottom)===16,tag+': 16px text inset');
  const text=items.filter(item=>item.getBoundingClientRect().width>100).map(item=>parseFloat(w.getComputedStyle(item.querySelector('.md-carousel-caption')).opacity));
  check(text.some(opacity=>opacity===1),tag+': readable item has opaque text');
  const narrow=items.find(item=>item.getBoundingClientRect().width<=56);
  if(narrow)check(parseFloat(w.getComputedStyle(narrow.querySelector('.md-carousel-caption')).opacity)===0,tag+': small mask hides text');
 }else{
  const caption=root.querySelector(content==='above'?'.md-carousel-before':'.md-carousel-after'),a=caption.getBoundingClientRect(),b=items[0].getBoundingClientRect();
  check(a.width>0&&a.height>0,tag+': external caption visible');
  check(Math.abs(a.left-b.left)<.2,tag+': caption aligns with image');
  check(content==='above'?a.bottom<=b.top:a.top>=b.bottom,tag+': caption outside image');
  const tops=items.filter(i=>w.getComputedStyle(i).visibility!=='hidden').map(i=>i.getBoundingClientRect().top);
  check(tops.every(top=>Math.abs(top-tops[0])<.2),tag+': image tops align');
  const viewport=root.querySelector('.md-carousel-viewport');viewport.style.scrollSnapType='none';viewport.scrollLeft=60;await wait(80);
  const moved=items.find(item=>w.getComputedStyle(item).visibility!=='hidden'&&item.getBoundingClientRect().width>80);
  if(moved){const label=moved.parentElement.querySelector(content==='above'?'.md-carousel-before':'.md-carousel-after');check(Math.abs(label.getBoundingClientRect().left-(variant.startsWith('uncontained')?moved.parentElement:moved).getBoundingClientRect().left)<.2,tag+': caption follows its scrolling item');}

 }
}
out.textContent=JSON.stringify({passed:checks.length,checks},null,2);
}catch(error){out.textContent=JSON.stringify({passed:checks.length,error:error.stack,checks},null,2)}finally{run.disabled=false}
};
</script>
<script>
// Exercise text fitting independently of carousel size roles, including clipping
// at both viewport edges and wrapped labels in mixed-aspect-ratio items.
const fitRun=document.createElement('button');fitRun.textContent='Run text-fit regression checks';document.body.append(fitRun);
fitRun.onclick=async()=>{fitRun.disabled=true;const checks=[],check=(ok,name)=>{if(!ok)throw Error(name);checks.push(name)},wait=ms=>new Promise(r=>setTimeout(r,ms));
try{
for(const variant of ['multi-browse','hero','center-aligned-hero','uncontained','uncontained-multi-aspect-ratio']){
 samples.replaceChildren();const f=document.createElement('iframe');f.style.width='1000px';samples.append(f);
 await new Promise(resolve=>{f.onload=resolve;f.src=`/components/carousel?preview.compare=interactive&preview.variant=${variant}&preview.content=overlay&preview.viewport=600`});
 const d=f.contentDocument,w=f.contentWindow;await w.TokenAssets.ready;await d.fonts.ready;await wait(100);
 const root=d.querySelector('#component-preview .md-carousel'),view=root.querySelector('.md-carousel-viewport');view.style.scrollSnapType='none';
 const captions=[...root.querySelectorAll('.md-carousel-caption')],heights=captions.map(c=>c.getBoundingClientRect().height),widths=captions.map(c=>c.getBoundingClientRect().width);
 const max=view.scrollWidth-view.clientWidth;
 for(const scroll of [0,60,160,248,496,744,Math.max(0,max-80),max]){
  view.scrollLeft=scroll;await wait(80);
  const v=view.getBoundingClientRect();
  for(const [index,caption] of captions.entries()){
   const item=caption.closest('.md-carousel-item'),b=item.getBoundingClientRect(),c=caption.getBoundingClientRect();
   if(b.right<=v.left||b.left>=v.right||w.getComputedStyle(item).visibility==='hidden')continue;
   const range=d.createRange();range.selectNodeContents(caption);const text=range.getBoundingClientRect();
   const clearance=Math.min(text.left-Math.max(v.left,b.left,c.left),Math.min(v.right,b.right,c.right)-text.right,text.top-Math.max(v.top,b.top,c.top),Math.min(v.bottom,b.bottom,c.bottom)-text.bottom);
   check(Math.abs(c.height-heights[index])<.1&&Math.abs(c.width-widths[index])<.1,`${variant}/${scroll}/${caption.textContent.trim()}: text layout does not rewrap with the mask`);
   const opacity=parseFloat(w.getComputedStyle(caption).opacity),name=`${variant}/${scroll}/${caption.textContent.trim()}`;
   if(caption.textContent.trim()==='Green River'&&b.width<=56.1)check(opacity===0,name+': no fragments in small preview');
   if(clearance>=0)check(opacity===1,name+': fitting text remains opaque');
   else if(clearance<-.1)check(opacity<1,name+': clipped text fades');
  }
 }
}
out.textContent=JSON.stringify({passed:checks.length,checks},null,2);
}catch(error){out.textContent=JSON.stringify({passed:checks.length,error:error.stack,checks},null,2)}finally{fitRun.disabled=false}
};
</script>
