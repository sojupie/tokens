<!doctype html><meta charset="utf-8"><title>Tooltip placement checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:960px;max-width:100%;height:600px}pre{white-space:pre-wrap}</style>
<h1>Tooltip placement checks</h1><button id="run">Run placement checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const button=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples');
button.onclick=async()=>{button.disabled=true;const checks=[];const assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)};
try{samples.replaceChildren();const frame=document.createElement('iframe');samples.append(frame);await new Promise(resolve=>{frame.onload=resolve;frame.src='/md3/components/tooltips?preview.compare=interactive&preview.variant=plain'});const w=frame.contentWindow,d=frame.contentDocument;await w.TokenAssets.ready;
const demo=d.querySelector('#component-preview .md-tooltip-demo'),trigger=demo.querySelector('button'),tip=demo.querySelector('[role=tooltip]'),near=(a,b)=>Math.abs(a-b)<.1;
trigger.focus();let a=trigger.getBoundingClientRect(),b=tip.getBoundingClientRect();assert(getComputedStyle(tip).visibility==='visible','Focus reveals the plain tooltip');assert(near(a.top-b.bottom,8),'Unbounded trigger has an 8px gap above');assert(near((a.left+a.right)/2,(b.left+b.right)/2),'Tooltip is centered on the trigger');
trigger.classList.replace('md-standard-icon-button','md-filled-icon-button');a=trigger.getBoundingClientRect();b=tip.getBoundingClientRect();assert(near(a.top-b.bottom,4),'Bounded trigger has a 4px gap above');
const bar=d.createElement('div');bar.className='md-app-bar';demo.before(bar);bar.append(demo);a=trigger.getBoundingClientRect();b=tip.getBoundingClientRect();assert(near(b.top-a.bottom,4),'App-bar tooltip appears below its trigger');trigger.classList.replace('md-filled-icon-button','md-standard-icon-button');a=trigger.getBoundingClientRect();b=tip.getBoundingClientRect();assert(near(b.top-a.bottom,8),'Unbounded app-bar trigger retains its 8px gap');
out.textContent=JSON.stringify({passed:checks.length,checks},null,2);
}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{button.disabled=false}};
</script>
