<!doctype html><meta charset="utf-8"><title>List selection checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:390px;height:700px}pre{white-space:pre-wrap}</style>
<h1>List selection checks</h1><button id="run">Run selection checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples');run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)};
try{for(const [mode,width,trailing] of [['single','icon','text'],['multiple','icon','text'],['single','radio','text'],['multiple','checkbox','text'],['multiple','icon','switch']]){samples.replaceChildren();const f=document.createElement('iframe');samples.append(f);await new Promise(resolve=>{f.onload=resolve;f.src=`/md3/components/lists?preview.compare=interactive&preview.control=select&preview.mode=${mode}&preview.width=${width}&preview.trailing=${trailing}`});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const list=d.querySelector('#component-preview .md-list[role=listbox]'),items=[...list.querySelectorAll('[role=option]')],key=(item,key)=>{item.focus();item.dispatchEvent(new w.KeyboardEvent('keydown',{key,bubbles:true,cancelable:true}))};assert(list.getAttribute('aria-multiselectable')===String(mode==='multiple'),`${mode}/${width}/${trailing}: selection mode exposed`);assert(items.length===3,'Each row exposes one option');assert(items.every(i=>!!i.getAttribute('aria-label')),'Options have visible-text names');assert(items.filter(i=>i.tabIndex===0).length===1,'List has one Tab entry');key(items[0],'ArrowUp');assert(d.activeElement===items[2],'Up wraps to final option');assert(items[2].tabIndex===0&&items[0].tabIndex===-1,'Arrow navigation updates Tab stop');key(items[2],'Enter');assert(items[2].getAttribute('aria-selected')==='true','Enter selects option');if(mode==='single'){assert(items.filter(i=>i.getAttribute('aria-selected')==='true').length===1,'Single selection clears other options');key(items[2],' ');assert(items[2].getAttribute('aria-selected')==='true','Single selection cannot deselect itself')}else{key(items[2],' ');assert(items[2].getAttribute('aria-selected')==='false','Space toggles multiple selection')};assert([...list.querySelectorAll('input')].every(i=>i.tabIndex===-1&&i.getAttribute('aria-hidden')==='true'),'Nested check marks do not create duplicate controls');}
out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
