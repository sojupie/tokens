<!doctype html><meta charset="utf-8"><title>Drawer layout checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:760px;max-width:100%;height:600px}pre{white-space:pre-wrap}</style>
<h1>Drawer layout checks</h1><button id="run">Run drawer checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples');
run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)};
try{for(const rtl of [false,true]){samples.replaceChildren();const frame=document.createElement('iframe');samples.append(frame);await new Promise(resolve=>{frame.onload=resolve;frame.src='/md3/components/navigation-drawer?preview.compare=interactive&preview.variant=modal'});const w=frame.contentWindow,d=frame.contentDocument;await w.TokenAssets.ready;const drawer=d.querySelector('#component-preview dialog'),opener=d.querySelector('#component-preview [data-navigation-open]');assert(!!drawer,'Modal drawer rendered');drawer.dir=rtl?'rtl':'ltr';opener.click();assert(drawer.open,'External control opens drawer');const r=drawer.getBoundingClientRect();assert(Math.abs(rtl?r.right-d.documentElement.clientWidth:r.left)<1,`${rtl?'RTL':'LTR'} drawer anchors at start edge`);const items=drawer.querySelector('.md-nav-items');for(let i=0;i<25;i++)items.append(items.querySelector('button').cloneNode(true));const head=drawer.querySelector('h3').getBoundingClientRect().top;items.scrollTop=150;assert(items.scrollTop>0,'Destination region scrolls');assert(drawer.querySelector('h3').getBoundingClientRect().top===head,'Drawer header stays fixed');assert(items.clientWidth>=items.scrollWidth,'No horizontal scrolling');
const target=items.querySelector('button'),x=r.left+r.width/2,y=r.top+80;target.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerType:'touch',isPrimary:true,pointerId:1,clientX:x,clientY:y}));target.dispatchEvent(new w.PointerEvent('pointerup',{bubbles:true,pointerType:'touch',isPrimary:true,pointerId:1,clientX:x+(rtl?1:-1)*r.width/3,clientY:y+4}));assert(!drawer.open,'Touch swipe toward start closes drawer');}
out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
