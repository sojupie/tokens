<!doctype html><meta charset="utf-8"><title>App bar search sizing checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:1400px;height:700px}pre{white-space:pre-wrap}</style>
<h1>App bar search sizing checks</h1><button id="run">Run search sizing checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples');run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)};
try{samples.replaceChildren();const f=document.createElement('iframe');samples.append(f);await new Promise(resolve=>{f.onload=resolve;f.src='/md3/components/app-bars?preview.compare=interactive&preview.variant=small&preview.control=search'});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const demo=d.querySelector('#component-preview .md-appbar-demo'),bar=demo.querySelector('.md-app-bar'),row=bar.querySelector('.md-appbar-row'),search=bar.querySelector('.md-appbar-search');for(const width of [280,600,1100]){demo.style.inlineSize=width+'px';const cells=w.getComputedStyle(row).gridTemplateColumns.split(' ').map(parseFloat),available=cells[1],r=search.getBoundingClientRect(),expected=Math.min(available,Math.max(312,available/2));assert(Math.abs(r.width-expected)<1,`${width}px: search uses available space up to 312px, then half the space`);assert(r.right<=bar.querySelector('.md-appbar-actions').getBoundingClientRect().left,'Search does not overlap actions')};out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
