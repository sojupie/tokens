<!doctype html><meta charset="utf-8"><title>Rich tooltip checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:900px;height:700px}pre{white-space:pre-wrap}</style>
<h1>Rich tooltip checks</h1><button id="run">Run rich tooltip checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples'),frames=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)};
try{samples.replaceChildren();const f=document.createElement('iframe');samples.append(f);await new Promise(resolve=>{f.onload=resolve;f.src='/md3/components/tooltips?preview.compare=interactive&preview.variant=rich'});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const demo=d.querySelector('#component-preview .md-tooltip-demo'),trigger=demo.querySelector('button'),tip=demo.querySelector('[popover]'),headline=tip.querySelector('h3').cloneNode(true),body=tip.querySelector('p').cloneNode(true),action=tip.querySelector('.md-feedback-action').cloneNode(true);d.body.append(demo);trigger.style.position='fixed';trigger.style.left='40px';trigger.style.top='40px';trigger.click();await frames();let a=trigger.getBoundingClientRect(),b=tip.getBoundingClientRect();assert(Math.abs(b.left-a.right)<1&&b.top>=a.bottom,'Default placement is below and to the right');
for(const hasHeadline of [false,true])for(const actions of [0,1,2]){tip.replaceChildren();if(hasHeadline)tip.append(headline.cloneNode(true));tip.append(body.cloneNode(true));for(let i=0;i<actions;i++){const button=action.cloneNode(true);button.textContent=i?'Cancel':'Confirm';tip.append(button)}w.dispatchEvent(new w.Event('resize'));await frames();assert(tip.querySelectorAll('h3').length===Number(hasHeadline)&&tip.querySelectorAll('button').length===actions,`${hasHeadline}/${actions}: content configuration rendered`);assert(tip.scrollWidth<=tip.clientWidth,'Content fits without horizontal clipping');}
for(const [width,height,x,y]of [[390,600,280,520],[390,600,10,10],[390,220,130,90]]){f.style.width=width+'px';f.style.height=height+'px';trigger.style.left=x+'px';trigger.style.top=y+'px';await frames();w.dispatchEvent(new w.Event('resize'));await frames();a=trigger.getBoundingClientRect();b=tip.getBoundingClientRect();assert(b.left>=7.5&&b.right<=d.documentElement.clientWidth-7.5&&b.top>=7.5&&b.bottom<=d.documentElement.clientHeight-7.5,'Tooltip stays inside the viewport');assert(!(b.left<a.right&&b.right>a.left&&b.top<a.bottom&&b.bottom>a.top),'Tooltip does not cover its trigger');if(tip.scrollHeight>tip.clientHeight){tip.scrollTop=10;await frames();assert(tip.scrollTop>0,'Short-window content remains scrollable without reposition resets')}}
out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
