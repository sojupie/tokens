<!doctype html><meta charset="utf-8"><title>Time picker fitting checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:900px;height:800px}pre{white-space:pre-wrap}</style>
<h1>Time picker fitting checks</h1><button id="run">Run checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result');run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)},frames=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
try{const f=document.createElement('iframe');document.querySelector('#samples').replaceChildren(f);await new Promise(resolve=>{f.onload=resolve;f.src='/md3/components/time-pickers?preview.compare=interactive'});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const root=d.querySelector('#component-preview .md-time-demo'),panel=root.querySelector('.md-time-panel');root.querySelector('[data-time-open]').click();await frames();for(const [width,height,mode,orientation]of [[390,800,'clock','portrait'],[900,450,'clock','landscape'],[390,390,'input','landscape'],[390,800,'clock','portrait']]){f.style.width=width+'px';f.style.height=height+'px';await frames();assert(panel.dataset.mode===mode,`${width}×${height} uses ${mode}`);assert(panel.dataset.orientation===orientation,'Orientation fits the available space');assert(panel.scrollHeight<=panel.clientHeight+1&&panel.scrollWidth<=panel.clientWidth+1,'Time picker fits without scrolling');assert(root.querySelector('[data-time-value="hour"]').textContent==='10','Time is preserved');assert(d.activeElement.getClientRects().length>0,'Focus stays visible');}out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
