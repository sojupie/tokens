<!doctype html><meta charset="utf-8"><title>Headline layout checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:390px;height:700px}pre{white-space:pre-wrap}</style>
<h1>Headline layout checks</h1><button id="run">Run headline checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples');run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)};
try{for(const variant of ['small','medium-flexible','large-flexible']){samples.replaceChildren();const f=document.createElement('iframe');samples.append(f);await new Promise(resolve=>{f.onload=resolve;f.src=`/md3/components/app-bars?preview.compare=interactive&preview.variant=${variant}`});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const bar=d.querySelector('#component-preview .md-app-bar'),title=bar.querySelector('.md-appbar-title'),row=bar.querySelector('.md-appbar-row');assert(title.tagName==='H3',`${variant}: title has heading semantics`);title.textContent='A headline that needs two lines to fit in this app bar';const s=w.getComputedStyle(title),r=title.getBoundingClientRect();if(variant==='small')assert(s.whiteSpace==='nowrap','Small headline stays on one line');else{assert(s.whiteSpace==='normal',`${variant}: headline can wrap`);assert(r.height>parseFloat(s.lineHeight),`${variant}: headline uses two lines`);assert(r.top>=row.getBoundingClientRect().bottom-1,`${variant}: headline does not overlap controls`);assert(r.bottom<=bar.getBoundingClientRect().bottom,`${variant}: bar contains headline`)}
}
out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
