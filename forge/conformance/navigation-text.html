<!doctype html><meta charset="utf-8"><title>Navigation text checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:390px;height:700px}pre{white-space:pre-wrap}</style>
<h1>Navigation text checks</h1><button id="run">Run navigation text checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples'),frames=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)};
try{for(const variant of ['vertical','horizontal']){samples.replaceChildren();const f=document.createElement('iframe');if(variant==='horizontal')f.style.width='760px';samples.append(f);await new Promise(resolve=>{f.onload=resolve;f.src=`/md3/components/navigation-bar?preview.compare=interactive&preview.variant=${variant}`});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const bar=d.querySelector('#component-preview .md-navigation-bar'),items=[...bar.querySelectorAll('.md-nav-item')];await frames();const before=bar.getBoundingClientRect().height;for(const item of items){item.style.fontSize=2*parseFloat(w.getComputedStyle(item).fontSize)+'px';item.style.lineHeight='1.4';}bar.querySelector('.md-nav-label').textContent='Saved places';await frames();const rect=bar.getBoundingClientRect();assert(variant==='vertical'?rect.height>before:rect.height>=before,`${variant}: surface accommodates 2x text size`);for(const label of bar.querySelectorAll('.md-nav-label')){const r=label.getBoundingClientRect();assert(r.top>=rect.top-.5&&r.bottom<=rect.bottom+.5,`${variant}: label fits vertically`);assert(r.left>=rect.left-.5&&r.right<=rect.right+.5,`${variant}: label fits horizontally`);assert(label.scrollWidth<=label.clientWidth+1,'Label is not horizontally clipped')}assert(bar.scrollWidth<=bar.clientWidth,'Bar does not overflow');}
out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
