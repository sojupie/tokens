<!doctype html><meta charset="utf-8"><title>Tooltip disclosure checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:390px;height:700px}pre{white-space:pre-wrap}</style>
<h1>Tooltip disclosure checks</h1><button id="run">Run tooltip checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples'),wait=ms=>new Promise(r=>setTimeout(r,ms));run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)};
try{for(const slug of ['icon-buttons','floating-action-button']){samples.replaceChildren();const f=document.createElement('iframe');samples.append(f);await new Promise(resolve=>{f.onload=resolve;f.src=`/md3/components/${slug}?preview.compare=interactive`});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const demo=d.querySelector('#component-preview .md-tooltip-demo'),trigger=demo.querySelector('button'),tip=demo.querySelector('[role=tooltip]');assert(tip.textContent===trigger.getAttribute('aria-label'),`${slug}: tooltip matches control name`);trigger.focus();assert(w.getComputedStyle(tip).visibility==='visible',`${slug}: keyboard focus opens tooltip`);trigger.blur();await wait(100);assert(w.getComputedStyle(tip).visibility==='visible',`${slug}: tooltip remains during exit grace`);await wait(1450);assert(w.getComputedStyle(tip).visibility==='hidden',`${slug}: tooltip dismisses after exit grace`);trigger.dispatchEvent(new w.PointerEvent('pointerdown',{bubbles:true,pointerType:'touch',isPrimary:true,pointerId:2}));await wait(550);assert(w.getComputedStyle(tip).visibility==='visible',`${slug}: touch hold opens tooltip`);trigger.dispatchEvent(new w.PointerEvent('pointercancel',{bubbles:true,pointerType:'touch',isPrimary:true,pointerId:2}));assert(w.getComputedStyle(tip).visibility==='hidden',`${slug}: cancelled touch closes tooltip`);}
out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
