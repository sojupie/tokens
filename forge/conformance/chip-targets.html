<!doctype html><meta charset="utf-8"><title>Chip target checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:390px;height:700px}pre{white-space:pre-wrap}</style>
<h1>Chip target checks</h1><button id="run">Run chip checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples');run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)};
try{samples.replaceChildren();const f=document.createElement('iframe');samples.append(f);await new Promise(resolve=>{f.onload=resolve;f.src='/md3/components/chips?preview.compare=interactive&preview.variant=input'});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const chip=d.querySelector('#component-preview [data-family=chip]'),primary=chip.querySelector('.md-chip-primary'),remove=chip.querySelector('.md-chip-remove');chip.scrollIntoView({block:'center',behavior:'instant'});const r=remove.getBoundingClientRect(),p=primary.getBoundingClientRect();assert(r.width>=48,'Remove target is at least 48px wide');assert(p.width>=48,'Primary target is at least 48px wide');assert(chip.getBoundingClientRect().height===32,'Visible chip remains 32px tall');assert(d.elementFromPoint(r.left+r.width/2,r.top-6).closest('.md-chip-remove')===remove,'Remove hit area extends above visible chip');assert(d.elementFromPoint(r.left+r.width/2,r.bottom+6).closest('.md-chip-remove')===remove,'Remove hit area extends below visible chip');assert(d.elementFromPoint(p.left+p.width/2,p.top-6).closest('.md-chip-primary')===primary,'Primary extension does not intersect remove target');assert(parseFloat(w.getComputedStyle(remove).paddingInlineEnd)===8,'Trailing icon keeps its 8px edge padding');primary.click();assert(primary.getAttribute('aria-pressed')==='true','Primary action selects');assert(!chip.hidden,'Primary action does not remove chip');remove.click();assert(chip.hidden,'Secondary action removes chip');out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
