<!doctype html><meta charset="utf-8"><title>Adaptive search checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:1100px;height:800px}pre{white-space:pre-wrap}</style>
<h1>Adaptive search checks</h1><button id="run">Run search checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples');run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)},frames=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
try{samples.replaceChildren();const f=document.createElement('iframe');samples.append(f);await new Promise(resolve=>{f.onload=resolve;f.src='/md3/components/search?preview.compare=interactive&preview.variant=adaptive'});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const panel=d.querySelector('#component-preview .md-search-view'),root=panel.closest('.md-search-demo'),workspace=root.querySelector('.md-search-workspace'),input=panel.querySelector('input.md-search-input');assert(!!workspace,'Adaptive mail composition rendered');input.focus();input.value='component';input.dispatchEvent(new w.Event('input',{bubbles:true}));for(const [width,variant] of [[390,'full-screen'],[900,'docked'],[500,'full-screen']]){workspace.style.inlineSize=width+'px';await frames();assert(panel.dataset.variant===variant,`${width}px app uses ${variant} search`);assert(input.value==='component','Query survives layout change');assert(panel.dataset.open==='true','Search stays open across breakpoint');}out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
