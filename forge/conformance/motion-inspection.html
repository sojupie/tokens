<!doctype html><meta charset="utf-8"><title>Motion recorder calibration</title>
<style>body{font:18px system-ui;margin:48px}#container{margin-top:24px;width:200px;height:100px;border:2px solid #666;padding:16px;transition:width 500ms cubic-bezier(.2,0,0,1)}#label{display:inline-block;transform:translateX(0);opacity:.2;transition:transform 500ms cubic-bezier(.2,0,0,1),opacity 200ms linear}#container.open{width:400px}#container.open #label{transform:translateX(96px);opacity:1}</style>
<h1>Motion recorder calibration</h1><p>Known transitions for checking capture and analysis. This is not a component conformance example.</p><button id="toggle" type="button">Animate label</button><div id="container"><span id="label">Example label</span></div><script>toggle.onclick=()=>container.classList.toggle('open');</script>
