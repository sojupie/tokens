<!doctype html><meta charset="utf-8"><title>Carousel motion checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:960px;height:600px;border:1px solid #aaa}pre{white-space:pre-wrap}button{padding:12px}</style>
<h1>Carousel motion checks</h1><button id="run">Check carousel motion</button><pre id="result">Ready</pre><div id="frames"></div>
<script type="module">
import {checkCarousel} from './check-carousel.mjs';
run.onclick=async()=>{run.disabled=true;result.textContent='Running';try{result.textContent=JSON.stringify(await checkCarousel(document.querySelector('#frames')),null,2);}catch(e){result.textContent=e.stack;}run.disabled=false;};
</script>
