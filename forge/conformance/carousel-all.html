<!doctype html><meta charset="utf-8"><title>Carousel access checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:390px;height:700px}pre{white-space:pre-wrap}</style>
<h1>Carousel access checks</h1><button id="run">Run carousel access checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples');run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)};
try{for(const variant of ['hero','full-screen']){samples.replaceChildren();const f=document.createElement('iframe');samples.append(f);await new Promise(resolve=>{f.onload=resolve;f.src=`/md3/components/carousel?preview.compare=interactive&preview.variant=${variant}`});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const root=d.querySelector('#component-preview .md-carousel'),all=root.querySelector('.md-carousel-all');if(variant==='full-screen'){assert(!all,'Full-screen carousel omits the all-items alternative');continue}const scroll=root.querySelector('.md-carousel-viewport'),before=scroll.scrollLeft,summary=all.querySelector('summary');summary.click();assert(all.open,'Show all opens the native disclosure');assert(scroll.scrollLeft===before,'All-items view does not move the horizontal carousel');assert(all.querySelectorAll('li svg[role=img]').length===6,'All six illustrations are available vertically');assert(all.querySelectorAll('li').length===root.querySelectorAll('.md-carousel-item').length,'All-items content matches the carousel count');assert(parseFloat(w.getComputedStyle(summary).paddingInlineStart)===4,'Show all retains the specified 4px inset');assert(all.scrollWidth<=root.clientWidth,'Alternative view fits the available width');}
out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
