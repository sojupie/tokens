<!doctype html><meta charset="utf-8"><title>Snackbar layout checks</title>
<style>body{font:16px system-ui;margin:24px}iframe{width:390px;height:700px}pre{white-space:pre-wrap}</style>
<h1>Snackbar layout checks</h1><button id="run">Run snackbar layout checks</button><pre id="result">Ready</pre><div id="samples"></div>
<script type="module">
const run=document.querySelector('#run'),out=document.querySelector('#result'),samples=document.querySelector('#samples');run.onclick=async()=>{run.disabled=true;const checks=[],assert=(ok,message)=>{if(!ok)throw Error(message);checks.push(message)};
try{for(const width of [390,900]){samples.replaceChildren();const f=document.createElement('iframe');f.style.width=width+'px';samples.append(f);await new Promise(resolve=>{f.onload=resolve;f.src='/md3/components/snackbar?preview.compare=interactive'});const w=f.contentWindow,d=f.contentDocument;await w.TokenAssets.ready;const bar=d.querySelector('#component-preview .md-snackbar'),opener=d.querySelector('#component-preview [data-snackbar-open]');bar.querySelector('.md-feedback-text').textContent='Your changes have been saved. You can continue editing this document.';const obstacle=d.createElement('button');obstacle.dataset.snackbarAvoid='';obstacle.textContent='Persistent navigation';obstacle.style.cssText='position:fixed;inset: auto 0 0;height:64px;';d.body.append(obstacle);opener.click();let r=bar.getBoundingClientRect();assert(r.bottom<=obstacle.getBoundingClientRect().top-15,'Snackbar stays above bottom controls');assert(r.left>=15&&r.right<=d.documentElement.clientWidth-15,'Snackbar retains viewport margins');assert(bar.scrollWidth<=bar.clientWidth,'Message and actions fit without horizontal overflow');if(width===390)assert(r.height>=64,'Compact snackbar is at least 64px tall');else assert(w.getComputedStyle(bar.querySelector('.md-feedback-text')).maxInlineSize!=='none','Wide snackbar caps message length');bar.hidePopover();obstacle.remove();opener.click();assert(bar.getBoundingClientRect().bottom>r.bottom,'Placement resets when obstacle is removed');bar.hidePopover();}
out.textContent=JSON.stringify({passed:checks.length,checks},null,2)}catch(error){out.textContent=JSON.stringify({passed:checks.length,checks,error:error.stack},null,2)}finally{run.disabled=false}};
</script>
