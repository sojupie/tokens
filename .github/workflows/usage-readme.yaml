name: Update usage graphic

on:
  workflow_dispatch:
  schedule:
    - cron: '15 9 * * 1'

permissions:
  contents: write

concurrency:
  group: tokens-production
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, tokens-prod]
    environment: production
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Generate usage graphic
        run: |
          set -euo pipefail
          sudo -n /usr/bin/docker compose -f /opt/tokens/deploy/compose.yaml --profile usage run --rm --no-deps usage usage --since 7d --svg > docs/images/usage.svg
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('docs/images/usage.svg').getroot()
          assert root.tag == '{http://www.w3.org/2000/svg}svg'
          PY
      - name: Publish graphic
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- docs/images/usage.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update weekly usage graphic'
          git pull --rebase origin main
          git push origin HEAD:main
          printf 'Updated the [README usage graphic](https://github.com/%s/blob/main/docs/images/usage.svg).\n' "$GITHUB_REPOSITORY" >> "$GITHUB_STEP_SUMMARY"
