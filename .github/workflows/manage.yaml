name: Manage Token Catalog
run-name: Token Catalog · ${{ inputs.operation || 'deploy' }} ${{ inputs.run_id }}

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: What to do
        type: choice
        required: true
        default: status
        options:
          - status
          - logs
          - deploy
          - restart
          - crawl
          - inspect
          - approve
          - retry
          - test-notification
          - usage-report
      run_id:
        description: Run ID (required for inspect, approve and retry)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: tokens-production
  cancel-in-progress: false

jobs:
  manage:
    name: ${{ inputs.operation || 'deploy' }}
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'Deploy production:'))
    runs-on: [self-hosted, linux, x64, tokens-prod]
    environment: production
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: /opt/tokens
    env:
      OPERATION: ${{ inputs.operation || 'deploy' }}
      RUN_ID: ${{ inputs.run_id }}
      TOKENS_PUBLIC_ORIGIN: ${{ vars.TOKENS_PUBLIC_ORIGIN }}
    steps:
      - name: Check inputs and installation
        run: |
          set -euo pipefail
          case "$OPERATION" in
            inspect|approve|retry)
              if [[ ! "$RUN_ID" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]]; then
                echo 'A valid run ID is required.' >&2
                exit 1
              fi
              ;;
            status|logs|deploy|restart|crawl|test-notification|usage-report) ;;
            *) echo 'Unknown operation.' >&2; exit 1 ;;
          esac
          if [[ "$OPERATION" == deploy && -z "$TOKENS_PUBLIC_ORIGIN" ]]; then
            echo 'Set TOKENS_PUBLIC_ORIGIN in the production environment variables on GitHub.' >&2
            exit 1
          fi
          test -f deploy/compose.yaml
          sudo -n /usr/bin/docker compose -f deploy/compose.yaml config --quiet

      - name: Pause scheduled updates
        id: pause
        if: contains(fromJSON('["deploy","restart","crawl","approve","retry"]'), env.OPERATION)
        run: |
          set -euo pipefail
          if /usr/bin/systemctl is-active --quiet tokens-update.timer; then
            echo 'resume_timer=true' >> "$GITHUB_OUTPUT"
            sudo -n /usr/bin/systemctl stop tokens-update.timer
          fi
          state=$(/usr/bin/systemctl show tokens-update.service --property=ActiveState --value)
          case "$state" in
            active|activating|deactivating)
              echo 'An update is running. Let it finish, then run this workflow again.' >&2
              exit 1
              ;;
          esac
          running=$(sudo -n /usr/bin/docker ps \
            --filter label=com.docker.compose.project=tokens \
            --filter label=com.docker.compose.service=updater --format '{{.ID}}')
          if [[ -n "$running" ]]; then
            echo 'An updater container is running. Let it finish first.' >&2
            exit 1
          fi

      - name: Run management command
        run: |
          set -euo pipefail
          compose_env=()
          compose() { sudo -n /usr/bin/docker compose "${compose_env[@]}" -f deploy/compose.yaml "$@"; }
          update() { sudo -n /usr/bin/sh /opt/tokens/deploy/update.sh "$@"; }
          timed() {
            local label="$1" started=$SECONDS result
            shift
            echo "::group::$label"
            if "$@"; then result=0; else result=$?; fi
            echo "::endgroup::"
            printf '%s: %ss (exit %s)\n' "$label" "$((SECONDS - started))" "$result" >> "$GITHUB_STEP_SUMMARY"
            return "$result"
          }
          case "$OPERATION" in
            deploy)
              [[ "$(git branch --show-current)" == main ]]
              case "$(git remote get-url origin)" in
                https://github.com/sojupie/tokens.git|git@github.com:sojupie/tokens.git) ;;
                *) echo 'Unexpected origin in /opt/tokens.' >&2; exit 1 ;;
              esac
              timed 'Fetch source' git fetch https://github.com/sojupie/tokens.git main:refs/remotes/origin/main
              git merge-base --is-ancestor "$GITHUB_SHA" origin/main
              if ! git merge-base --is-ancestor HEAD "$GITHUB_SHA"; then
                echo 'This deployment would go backwards or overwrite local commits.' >&2
                exit 1
              fi
              checkout_status=$(git status --porcelain)
              if [[ -n "$checkout_status" ]]; then
                # Preserve the old host's version-only pin before adopting the
                # maintained tunnel configuration. All other edits still block.
                normalize_pin() { sed -E 's@(image: cloudflare/cloudflared:)(latest|[0-9]{4}\.[0-9]+\.[0-9]+)$@\1VERSION@'; }
                if [[ "$checkout_status" == ' M deploy/compose.yaml' ]] &&
                    cmp -s <(git show HEAD:deploy/compose.yaml | normalize_pin) <(normalize_pin < deploy/compose.yaml); then
                  git stash push -m "Pre-deployment cloudflared pin $(date -u +%Y%m%dT%H%M%SZ)" -- deploy/compose.yaml
                  echo 'Preserved the previous cloudflared pin in the deployment checkout stash.'
                else
                  echo 'The deployment checkout has local changes. Resolve them first.' >&2
                  git status --short
                  git diff --stat
                  exit 1
                fi
              fi
              git merge --ff-only "$GITHUB_SHA"
              motion_revision=$(git ls-remote https://github.com/sojupie/material-motion-lab.git refs/heads/main | cut -f1)
              playground_revision=$(git ls-remote https://github.com/sojupie/carousel-motion-lab.git refs/heads/main | cut -f1)
              [[ "$motion_revision" =~ ^[0-9a-f]{40}$ && "$playground_revision" =~ ^[0-9a-f]{40}$ ]]
              tool_sources_file=$(mktemp)
              trap 'rm -f "$tool_sources_file"' EXIT
              printf 'TOKENS_MOTION_SOURCE=https://github.com/sojupie/material-motion-lab.git#%s\nTOKENS_PLAYGROUND_SOURCE=https://github.com/sojupie/carousel-motion-lab.git#%s\n' "$motion_revision" "$playground_revision" > "$tool_sources_file"
              compose_env=(--env-file "$tool_sources_file")
              printf 'Tool sources: Material Motion Lab `%s`; Carousel playground `%s`\n' "$motion_revision" "$playground_revision" >> "$GITHUB_STEP_SUMMARY"
              timed 'Install deployment configuration' sudo -n /usr/bin/sh /opt/tokens/deploy/install.sh
              timed 'Build images' compose --progress plain --profile update build --pull
              timed 'Build publication assets' update build-assets
              timed 'Save public URL' update configure-public-origin "$TOKENS_PUBLIC_ORIGIN"
              if /usr/bin/systemctl is-active --quiet tokens.service; then
                timed 'Update containers and wait for health' compose up -d --wait tokens cloudflared
              else
                timed 'Start service and wait for health' sudo -n /usr/bin/systemctl restart tokens.service
              fi
              ;;
            restart) sudo -n /usr/bin/systemctl restart tokens.service ;;
            crawl) sudo -n /usr/bin/systemctl start tokens-update.service ;;
            inspect) update inspect "$RUN_ID" ;;
            approve|retry)
              update "$OPERATION" "$RUN_ID"
              sudo -n /usr/bin/systemctl restart tokens.service
              ;;
            test-notification) update test-notification ;;
            usage-report)
              printf '## Usage report\n\n```text\n' >> "$GITHUB_STEP_SUMMARY"
              compose --profile usage run --rm --no-deps usage usage --since 7d --send | tee -a "$GITHUB_STEP_SUMMARY"
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
              ;;
            status)
              compose ps -a
              /usr/bin/systemctl list-timers --all tokens-update.timer
              update status
              ;;
            logs)
              compose logs --tail=100 tokens cloudflared
              sudo -n /usr/bin/journalctl -u tokens-update.service -u tokens-update-failure.service -n 100 --no-pager
              ;;
          esac
          if [[ "$OPERATION" == deploy || "$OPERATION" == restart || "$OPERATION" == approve || "$OPERATION" == retry ]]; then
            compose ps
          fi

      - name: Limit build cache after deployment
        if: always() && env.OPERATION == 'deploy' && steps.pause.outcome == 'success'
        run: sudo -n /usr/bin/docker builder prune --all --force --keep-storage 20GB

      - name: Show failure details
        if: failure()
        run: |
          sudo -n /usr/bin/docker compose -f deploy/compose.yaml ps -a
          sudo -n /usr/bin/journalctl -u tokens-update.service -u tokens-update-failure.service -n 100 --no-pager

      - name: Resume scheduled updates
        if: always() && steps.pause.outputs.resume_timer == 'true'
        run: sudo -n /usr/bin/systemctl start tokens-update.timer
